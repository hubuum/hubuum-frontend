name: hubuum-frontend-dev

services:
  valkey:
    image: docker.io/valkey/valkey:9.1.2-alpine3.24@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
    command: ["valkey-server", "--appendonly", "no", "--save", ""]
    user: "999:1000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data:size=32m,mode=1777
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:${VALKEY_DEV_PORT:-6379}:6379"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
