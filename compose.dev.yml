name: hubuum-frontend-dev

services:
  valkey:
    image: docker.io/valkey/valkey:9.2.0-alpine3.24@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
    command: ["valkey-server", "--appendonly", "no", "--save", ""]
    user: "999:1000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data:size=32m,mode=1777
      - /tmp:size=16m,mode=1777
    ports:
      # An explicitly empty port lets Docker/Podman allocate a free port.
      - "127.0.0.1:${VALKEY_DEV_PORT-6379}:6379"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
