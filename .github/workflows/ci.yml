name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  COMPAT_BACKEND_IMAGE: ghcr.io/hubuum/hubuum-server:v0.0.9@sha256:1f12baf882b6d3df5b4b2dbdf26aad0793274e57f86a2c186b8e1e68632db5db
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Test performance budget tooling
        run: npm run test:performance-budget
      - name: Test release dependency gate
        run: npm run test:release-dependencies
      - name: Build
        run: npm run build
      - name: Enforce frontend performance budgets
        run: npm run perf:budget
      - name: Audit runtime dependencies
        run: npm run audit:prod
      - name: Verify release metadata
        run: bash scripts/check-release-readiness.sh

  backend-contract:
    name: backend-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test against Hubuum Server v0.0.9
        env:
          HUBUUM_LIVE_BACKEND_IMAGE: ${{ env.COMPAT_BACKEND_IMAGE }}
        run: npm run test:live-backend

  browser-quality:
    name: browser-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public accessibility and responsive checks
        run: npm run test:e2e:public

  visual-regression:
    name: visual-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: npm ci
      - name: Compare portable visual baselines
        env:
          NEXT_PUBLIC_APP_VERSION: v0.0.0+visual
          VISUAL_REGRESSION: "1"
        run: npm run test:e2e:visual
      - name: Upload visual failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14

  authenticated-browser-smoke:
    name: authenticated-browser-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run authenticated browser smoke test
        env:
          HUBUUM_AUTH_E2E_BACKEND_IMAGE: ${{ env.COMPAT_BACKEND_IMAGE }}
        run: npm run test:e2e:authenticated

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve build version
        id: version
        shell: bash
        run: |
          package_version="$(jq --raw-output .version package.json)"
          echo "value=v${package_version}+${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate development dependencies
        run: docker compose -f compose.dev.yml config --quiet
      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: hubuum-frontend:ci
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test hardened image
        shell: bash
        run: |
          container_id="$(docker run --detach \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777 \
            --tmpfs /app/.next/cache:size=128m,uid=1001,gid=1001,mode=0750 \
            --env BACKEND_BASE_URL=http://127.0.0.1:9 \
            --publish 127.0.0.1:3000:3000 \
            hubuum-frontend:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          test "$(docker image inspect hubuum-frontend:ci --format '{{.Config.User}}')" = "1001"
          for attempt in $(seq 1 30); do
            if health_payload="$(curl --fail --silent http://127.0.0.1:3000/healthz)"; then
              break
            fi
            echo "Waiting for frontend health (${attempt}/30)..."
            sleep 1
          done
          if [[ -z "${health_payload:-}" ]]; then
            docker logs "$container_id"
            exit 1
          fi
          test "$(jq --raw-output .version <<< "$health_payload")" = \
            "${{ steps.version.outputs.value }}"
      - name: Smoke test Compose quickstart
        env:
          BACKEND_BASE_URL: http://127.0.0.1:9
          HUBUUM_FRONTEND_IMAGE: hubuum-frontend:ci
          HUBUUM_FRONTEND_PORT: 13001
        run: bash scripts/quickstart-smoke.sh
      - name: Smoke test frontend BFF against Hubuum Server v0.0.9
        env:
          HUBUUM_COMPAT_BACKEND_IMAGE: ${{ env.COMPAT_BACKEND_IMAGE }}
        run: bash scripts/release-stack-smoke.sh
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Validate Helm chart
        shell: bash
        run: |
          helm lint charts/hubuum-frontend \
            --set valkey.existingSecret.name=hubuum-valkey
          helm template test charts/hubuum-frontend \
            --set valkey.existingSecret.name=hubuum-valkey >/dev/null
          helm template test charts/hubuum-frontend \
            --set replicaCount=2 \
            --set valkey.existingSecret.name=hubuum-valkey >/dev/null
          helm template test charts/hubuum-frontend \
            --set loginBackgrounds.existingClaim=hubuum-login-backgrounds \
            --set valkey.existingSecret.name=hubuum-valkey >/dev/null
          if helm template invalid charts/hubuum-frontend >/dev/null 2>&1; then
            echo "Expected an install without a Valkey Secret to fail." >&2
            exit 1
          fi
          helm package charts/hubuum-frontend --destination /tmp

  publish-main-metadata:
    name: publish-main-metadata
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - backend-contract
      - browser-quality
      - visual-regression
      - authenticated-browser-smoke
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.value }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve build version
        id: version
        shell: bash
        run: |
          package_version="$(jq --raw-output .version package.json)"
          echo "value=v${package_version}+${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  publish-main-image:
    name: publish-main-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-main-metadata
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      job-name-prefix: publish-main-image
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      build-args: APP_VERSION=${{ needs.publish-main-metadata.outputs.version }}
      cache: true
      cache-scope: publish-main
      cache-mode: max
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=raw,value=main
        type=raw,value=${{ github.sha }}
      meta-labels: |
        org.opencontainers.image.title=Hubuum Frontend
        org.opencontainers.image.description=Web console for Hubuum Server
        org.opencontainers.image.licenses=MIT
        org.opencontainers.image.version=${{ needs.publish-main-metadata.outputs.version }}
      set-meta-labels: true
      sbom: true
      sign: "false"
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  publish-main:
    name: publish-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - publish-main-metadata
      - publish-main-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.publish-main-image.outputs.digest }}
          push-to-registry: true
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Publish development chart
        env:
          HELM_REGISTRY_CONFIG: /tmp/helm-registry.json
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          package_version="$(jq --raw-output .version package.json)"
          version="${package_version}-main.${GITHUB_RUN_NUMBER}"
          helm package charts/hubuum-frontend \
            --destination /tmp \
            --version "$version" \
            --app-version "$GITHUB_SHA"
          helm push "/tmp/hubuum-frontend-${version}.tgz" \
            oci://ghcr.io/${{ github.repository_owner }}/charts
