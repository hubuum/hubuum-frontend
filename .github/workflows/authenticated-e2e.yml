name: Full authenticated browser suite

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      backend_image:
        description: Optional Hubuum Server image override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: full-authenticated-browser-suite
  cancel-in-progress: true

env:
  COMPAT_BACKEND_IMAGE: ghcr.io/hubuum/hubuum-server:v0.0.5@sha256:6f3e0f0debd418acd5cbc2b1399db9859a85ca1fa397525a5ef0e2f493a77c9b

jobs:
  authenticated-browser:
    name: authenticated-browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run complete authenticated suite
        env:
          HUBUUM_FULL_E2E_BACKEND_IMAGE: ${{ inputs.backend_image || env.COMPAT_BACKEND_IMAGE }}
        run: npm run test:e2e:authenticated:full
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-authenticated-browser-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/playwright/
            test-results/full-authenticated/
          if-no-files-found: ignore
          retention-days: 14
