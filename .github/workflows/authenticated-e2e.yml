name: Full authenticated browser suite

on:
  pull_request:
    paths:
      - ".github/workflows/authenticated-e2e.yml"
      - "compose.dev.yml"
      - "docker-compose.live-backend.yml"
      - "package-lock.json"
      - "package.json"
      - "playwright.config.ts"
      - "scripts/full-authenticated-e2e.sh"
      - "tests/e2e/**"
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      backend_image:
        description: Optional Hubuum Server image override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: full-authenticated-browser-suite-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPAT_BACKEND_IMAGE: ghcr.io/hubuum/hubuum-server:v0.0.20@sha256:eaf59f8a4b4793030a78bc1637a8e2b9fad2f810b8621ff9a874dca534b9a23a

jobs:
  authenticated-browser:
    name: authenticated-browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run complete authenticated suite
        env:
          HUBUUM_FULL_E2E_BACKEND_IMAGE: ${{ inputs.backend_image || env.COMPAT_BACKEND_IMAGE }}
        run: npm run test:e2e:authenticated:full
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-authenticated-browser-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/playwright/
            test-results/full-authenticated/
          if-no-files-found: ignore
          retention-days: 14
