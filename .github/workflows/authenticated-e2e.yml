name: Full authenticated browser suite

on:
  pull_request:
    paths:
      - ".github/workflows/authenticated-e2e.yml"
      - "compose.dev.yml"
      - "docker-compose.live-backend.yml"
      - "package-lock.json"
      - "package.json"
      - "playwright.config.ts"
      - "scripts/full-authenticated-e2e.sh"
      - "tests/e2e/**"
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      backend_image:
        description: Optional Hubuum Server image override
        required: false
        type: string
      collection_integrations:
        description: Require collection integration tests against the updated server
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: full-authenticated-browser-suite-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPAT_BACKEND_IMAGE: ghcr.io/hubuum/hubuum-server:v0.0.17@sha256:cc0518167816bfddb38853b8b7217c4a347511318d51e1abca93ca418f31b302

jobs:
  authenticated-browser:
    name: authenticated-browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run complete authenticated suite
        env:
          HUBUUM_FULL_E2E_BACKEND_IMAGE: ${{ inputs.backend_image || env.COMPAT_BACKEND_IMAGE }}
          HUBUUM_FULL_E2E_COLLECTION_INTEGRATIONS: ${{ inputs.collection_integrations && '1' || '0' }}
        run: npm run test:e2e:authenticated:full
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-authenticated-browser-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/playwright/
            test-results/full-authenticated/
          if-no-files-found: ignore
          retention-days: 14
