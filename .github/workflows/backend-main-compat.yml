name: Backend main compatibility

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      server_image:
        description: Server image or digest to test
        default: ghcr.io/hubuum/hubuum-server:main
        type: string
  workflow_call:
    inputs:
      server_image:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backend-main-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test against backend main
        env:
          HUBUUM_LIVE_BACKEND_IMAGE: ${{ inputs.server_image || 'ghcr.io/hubuum/hubuum-server:main' }}
          HUBUUM_LIVE_REQUIRE_SCHEMA: "1"
        run: npm run test:live-backend
