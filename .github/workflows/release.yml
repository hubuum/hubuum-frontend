name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: verify-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require an annotated tag
        run: test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
      - name: Validate release metadata
        run: bash scripts/check-release-readiness.sh "$GITHUB_REF_NAME"
      - name: Verify the tagged commit passed CI on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          successful_runs="$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f head_sha="$GITHUB_SHA" \
            -f status=success \
            --jq '.total_count')"
          if [[ "$successful_runs" -lt 1 ]]; then
            echo "No successful main CI run found for $GITHUB_SHA." >&2
            exit 1
          fi

  publish-image:
    name: publish-release-image
    needs: verify
    uses: docker/github-builder/.github/workflows/build.yml@a492c6d04fd3315f67230809b44d60cc0acd50b3 # v1.16.0
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      job-name-prefix: publish-release-image
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      build-args: APP_VERSION=${{ github.ref_name }}
      cache: true
      cache-scope: publish-release
      cache-mode: max
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=raw,value=${{ github.ref_name }}
        type=semver,pattern={{version}}
        type=raw,value=sha-${{ github.sha }}
      meta-labels: |
        org.opencontainers.image.title=Hubuum Frontend
        org.opencontainers.image.description=Web console for Hubuum Server
        org.opencontainers.image.licenses=MIT
        org.opencontainers.image.version=${{ github.ref_name }}
      set-meta-labels: true
      sbom: true
      sign: "false"
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: publish-release
    needs:
      - verify
      - publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.publish-image.outputs.digest }}
          push-to-registry: true
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Publish release chart
        env:
          HELM_REGISTRY_CONFIG: /tmp/helm-registry.json
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          helm package charts/hubuum-frontend \
            --destination /tmp \
            --version "$version" \
            --app-version "$GITHUB_REF_NAME"
          helm push "/tmp/hubuum-frontend-${version}.tgz" \
            oci://ghcr.io/${{ github.repository_owner }}/charts
      - name: Build release assets and notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash scripts/package-quickstart.sh \
            "$version" \
            "${{ needs.publish-image.outputs.digest }}" \
            dist
          bash scripts/extract-changelog-section.sh "$version" > /tmp/release-notes.md
          test -s /tmp/release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/hubuum-frontend-"$GITHUB_REF_NAME"-compose.tar.gz \
            dist/SHA256SUMS \
            --latest \
            --notes-file /tmp/release-notes.md \
            --title "Hubuum Frontend $GITHUB_REF_NAME" \
            --verify-tag
