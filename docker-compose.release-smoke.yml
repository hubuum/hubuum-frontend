services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: hubuum
      POSTGRES_PASSWORD: hubuum_password
      POSTGRES_USER: hubuum
      PGUSER: hubuum
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubuum -d hubuum"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    image: ${HUBUUM_COMPAT_BACKEND_IMAGE}
    entrypoint: ["/usr/local/bin/hubuum-admin"]
    command: ["--migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HUBUUM_DATABASE_URL: postgres://hubuum:hubuum_password@postgres:5432/hubuum

  hubuum:
    image: ${HUBUUM_COMPAT_BACKEND_IMAGE}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://hubuum:hubuum_password@postgres:5432/hubuum
      HUBUUM_BIND_IP: 0.0.0.0
      HUBUUM_CLIENT_ALLOWLIST: "*"
      HUBUUM_DATABASE_URL: postgres://hubuum:hubuum_password@postgres:5432/hubuum
      HUBUUM_LOGIN_RATE_LIMIT_ENABLED: "false"
      HUBUUM_TOKEN_HASH_KEY: release-smoke-test-only-token-hash-key

  valkey:
    image: docker.io/valkey/valkey:9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    command: ["valkey-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  frontend:
    image: ${HUBUUM_FRONTEND_TEST_IMAGE:-hubuum-frontend:ci}
    pull_policy: never
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,uid=1001,gid=1001,mode=0750
    depends_on:
      hubuum:
        condition: service_started
      valkey:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_BASE_URL: http://hubuum:8080
      VALKEY_URL: redis://valkey:6379/0
    ports:
      - "127.0.0.1:${HUBUUM_FRONTEND_TEST_PORT:-13000}:3000"
