x-labels: &labels
  io.hubuum.sandbox.owner: ${SANDBOX_OWNER:?}
  io.hubuum.sandbox.run: ${SANDBOX_RUN:?}
  io.hubuum.sandbox.project: ${SANDBOX_PROJECT:?}

x-server-env: &server-env
  HUBUUM_DATABASE_URL: postgres://hubuum:${SANDBOX_DB_PASSWORD:?}@postgres:5432/hubuum
  HUBUUM_DATABASE_ROLE_MODE: single
  HUBUUM_TOKEN_HASH_KEY: ${SANDBOX_TOKEN_KEY:?}
  HUBUUM_LOG_LEVEL: warn
  HUBUUM_EVENT_RETENTION_PURGE_ENABLED: "false"

services:
  postgres:
    image: docker.io/library/postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    labels: *labels
    environment:
      POSTGRES_DB: hubuum
      POSTGRES_USER: hubuum
      POSTGRES_PASSWORD: ${SANDBOX_DB_PASSWORD:?}
    volumes:
      - database:/var/lib/postgresql

  valkey:
    image: docker.io/valkey/valkey:9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    labels: *labels
    command: [valkey-server, --appendonly, "no", --save, ""]
    read_only: true
    tmpfs: [/data, /tmp]
    ports:
      - "127.0.0.1::6379"

  hubuum:
    image: ${SANDBOX_IMAGE:?}
    pull_policy: never
    labels: *labels
    environment:
      <<: *server-env
      HUBUUM_BIND_IP: 0.0.0.0
      HUBUUM_CLIENT_ALLOWLIST: "*"
      # Rich corpus reports exceed the default byte and template execution limits.
      HUBUUM_EXPORT_MAX_OUTPUT_BYTES: "16777216"
      HUBUUM_EXPORT_TEMPLATE_FUEL: "1000000"
    ports:
      - "127.0.0.1::8080"

  restore-executor:
    image: ${SANDBOX_IMAGE:?}
    pull_policy: never
    labels: *labels
    entrypoint: [/usr/local/bin/hubuum-admin]
    command: [--restore-executor]
    environment: *server-env

volumes:
  database:
    labels: *labels

networks:
  default:
    labels: *labels
