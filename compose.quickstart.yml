name: hubuum-frontend

services:
  valkey:
    image: docker.io/valkey/valkey:9.2.0-alpine3.24@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
    user: "999:1000"
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - valkey_data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    image: ${HUBUUM_FRONTEND_IMAGE:-ghcr.io/hubuum/hubuum-frontend:v0.0.25}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,uid=1001,gid=1001,mode=0750
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-}
      SETUP_KEY: ${SETUP_KEY:-}
      VALKEY_URL: redis://valkey:6379/0
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      SESSION_PREFIX: ${SESSION_PREFIX:-hubuum:sess:}
      SETTINGS_PREFIX: ${SETTINGS_PREFIX:-hubuum:settings:}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Hubuum Console}
    volumes:
      - ${LOGIN_BACKGROUNDS_HOST_DIR:-./login-backgrounds}:/app/login-backgrounds:ro
    ports:
      - "127.0.0.1:${HUBUUM_FRONTEND_PORT:-3000}:3000"
    depends_on:
      valkey:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  valkey_data:
